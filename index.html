<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qysd AI</title>
    
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Qysd AI">
    <link rel="manifest" id="manifest-placeholder">

    <style>
        :root {
            --bg-color: #090a0f;
            --panel-bg: rgba(18, 22, 34, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --user-msg-bg: linear-gradient(135deg, #2563eb, #1d4ed8);
            --ai-msg-bg: rgba(30, 41, 59, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-color) 70%);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Mobile Header */
        #mobile-header {
            display: none;
            height: 56px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            backdrop-filter: blur(16px);
            z-index: 10;
        }

        .menu-toggle-btn {
            background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 18px;
            gap: 14px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .brand span { color: var(--accent-color); }

        .pwa-install-btn {
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid var(--accent-color);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .pwa-install-btn:hover { background: rgba(139, 92, 246, 0.3); }

        .new-chat-btn {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white; border: none;
            padding: 12px; border-radius: 12px;
            font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px var(--accent-glow);
        }

        #chat-list {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        .chat-item-wrapper {
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px; overflow: hidden;
            transition: all 0.2s;
        }

        .chat-item {
            flex: 1; padding: 10px 12px;
            font-size: 0.88rem; color: var(--text-sub);
            cursor: pointer; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        .chat-item-wrapper:hover, .chat-item-wrapper.active {
            background: rgba(139, 92, 246, 0.15);
            border-color: var(--accent-color);
        }

        .chat-item-wrapper.active .chat-item { color: #fff; font-weight: 600; }

        .delete-chat-btn {
            background: none; border: none; color: #ef4444;
            padding: 8px 10px; cursor: pointer; opacity: 0.6;
            transition: opacity 0.2s;
        }

        .delete-chat-btn:hover { opacity: 1; }

        .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 12px; }

        .settings-btn {
            width: 100%; background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color); color: var(--text-main);
            padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;
            transition: background 0.2s;
        }

        .settings-btn:hover { background: rgba(255, 255, 255, 0.08); }

        #sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); z-index: 15; backdrop-filter: blur(4px);
        }

        /* Main Window */
        #main-content {
            flex: 1; display: flex; flex-direction: column;
            position: relative; height: 100%; overflow: hidden;
        }

        #hero-section {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 20px; gap: 16px;
            animation: fadeIn 0.4s ease;
        }

        #hero-section h1 { font-size: 2.4rem; font-weight: 800; }

        .hero-cards {
            display: flex; gap: 14px; margin-top: 20px;
            flex-wrap: wrap; justify-content: center;
            width: 100%; max-width: 600px;
        }

        .hero-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px; border-radius: 14px;
            cursor: pointer; flex: 1; min-width: 220px;
            font-size: 0.9rem; color: var(--text-sub);
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .hero-card:hover {
            border-color: var(--accent-color);
            color: #fff; transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 24px;
            display: none; flex-direction: column; gap: 18px;
        }

        .message {
            max-width: 80%; padding: 14px 18px;
            border-radius: 16px; line-height: 1.55;
            font-size: 0.95rem; word-break: break-word;
            animation: slideUp 0.25s ease;
        }

        .msg-user {
            align-self: flex-end; background: var(--user-msg-bg);
            color: white; border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .msg-ai {
            align-self: flex-start; background: var(--ai-msg-bg);
            backdrop-filter: blur(12px); border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .msg-toolbar { display: flex; gap: 8px; margin-bottom: 8px; }

        .action-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--text-sub); padding: 4px 10px;
            border-radius: 8px; font-size: 0.75rem; cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        /* Input Area */
        #input-container {
            padding: 16px 24px; background: var(--panel-bg);
            backdrop-filter: blur(16px); border-top: 1px solid var(--border-color);
            display: flex; gap: 12px; align-items: flex-end;
        }

        #prompt-input {
            flex: 1; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px; padding: 12px 16px;
            color: #fff; resize: none; max-height: 130px;
            outline: none; font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        #prompt-input:focus { border-color: var(--accent-color); }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: #fff; min-width: 46px; height: 46px;
            border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; transition: all 0.2s;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .icon-btn.recording { background: #ef4444; animation: pulse 1.5s infinite; }

        #send-btn { background: var(--accent-color); border: none; }
        #send-btn:hover { background: var(--accent-hover); }

        /* Settings Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 100; padding: 16px;
        }

        .modal-content {
            background: #141824; border: 1px solid var(--border-color);
            padding: 26px; border-radius: 20px; width: 100%; max-width: 420px;
            display: flex; flex-direction: column; gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-content input, .modal-content select {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color);
            padding: 12px; color: #fff; border-radius: 10px; outline: none;
        }

        /* Pre Code Blocks */
        .code-container {
            background: #090d16; border: 1px solid var(--border-color);
            border-radius: 10px; margin: 10px 0; overflow: hidden;
        }

        .code-header {
            background: rgba(255, 255, 255, 0.05); padding: 8px 14px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.75rem; color: var(--text-sub);
        }

        .code-btn {
            background: none; border: none; color: var(--accent-color);
            cursor: pointer; font-size: 0.75rem; font-weight: 600;
        }

        pre { padding: 14px; overflow-x: auto; font-family: monospace; font-size: 0.88rem; color: #a7f3d0; }

        .typing-indicator { display: flex; gap: 5px; }
        .typing-dot {
            width: 8px; height: 8px; background: var(--text-sub);
            border-radius: 50%; animation: blink 1.4s infinite iterative;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            #mobile-header { display: flex; }
            #sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #sidebar-overlay.open { display: block; }
            .message { max-width: 92%; font-size: 0.9rem; }
            #hero-section h1 { font-size: 1.8rem; }
            #input-container { padding: 12px; }
        }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <div id="sidebar">
        <div class="brand">⚡ Qysd <span>AI</span></div>
        <button id="install-pwa-btn" class="pwa-install-btn" onclick="installPWA()">📲 Zainstaluj aplikację</button>
        <button class="new-chat-btn" onclick="startNewChat()">+ Nowa rozmowa</button>
        <div id="chat-list"></div>
        <div class="sidebar-footer">
            <button class="settings-btn" onclick="openSettings()">⚙️ Ustawienia</button>
        </div>
    </div>

    <div id="main-content">
        <div id="mobile-header">
            <button class="menu-toggle-btn" onclick="openMobileSidebar()">☰</button>
            <div class="brand" style="margin: 0; font-size: 1.1rem;">⚡ Qysd <span>AI</span></div>
            <button class="menu-toggle-btn" onclick="startNewChat()" style="font-size: 1.3rem;">+</button>
        </div>

        <div id="hero-section">
            <h1>W czym mogę pomóc?</h1>
            <p style="color: var(--text-sub);">Qysd AI jest gotowe do tworzenia i odpowiadania.</p>
            <div class="hero-cards">
                <div class="hero-card" onclick="setPrompt('Napisz tekst piosenki z zwrotkami i refrenem')">🎵 Tekst piosenki</div>
                <div class="hero-card" onclick="setPrompt('Stwórz skrypt Lua do gry')">🎮 Skrypt Lua do gry</div>
            </div>
        </div>

        <div id="chat-box"></div>

        <div id="input-container">
            <button class="icon-btn" id="mic-btn" onclick="toggleSpeechRecognition()">🎤</button>
            <textarea id="prompt-input" rows="1" placeholder="Napisz coś..." oninput="autoResizeTextarea(this)" onkeydown="handleKeyDown(event)"></textarea>
            <button class="icon-btn" id="send-btn" onclick="sendMessage()">➔</button>
        </div>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3>Ustawienia Qysd AI</h3>
            <label style="font-size: 0.8rem; color: var(--text-sub);">Własny Klucz API (Opcjonalnie):</label>
            <input type="password" id="api-key-input" placeholder="Wklej, jeśli chcesz użyć własnego">
            <label style="font-size: 0.8rem; color: var(--text-sub);">Język odpowiedzi:</label>
            <select id="language-select">
                <option value="Polski">Polski</option>
                <option value="English">English</option>
            </select>
            <button class="new-chat-btn" onclick="saveSettings()">Zapisz i zamknij</button>
        </div>
    </div>

    <script>
        // --- TUTAJ WKLEJ SWÓJ KLUCZ API GEMINI ---
        const DEFAULT_API_KEY = "TWÓJ_DOMYŚLNY_KLUCZ_API";

        // PWA Config
        const manifestData = {
            "name": "Qysd AI",
            "short_name": "Qysd AI",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#090a0f",
            "theme_color": "#8b5cf6",
            "icons": [{
                "src": "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
        document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-pwa-btn').style.display = 'flex';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('install-pwa-btn').style.display = 'none';
                });
            }
        }

        function openMobileSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebar-overlay').classList.add('open');
        }

        function closeMobileSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        }

        // Logic App
        let customApiKey = localStorage.getItem('qysd_custom_api_key') || '';
        let chats = JSON.parse(localStorage.getItem('qysd_chats')) || [];
        let currentChatId = null;
        let selectedLanguage = localStorage.getItem('qysd_lang') || 'Polski';
        let recognition = null;
        let isRecording = false;
        let activeAudioBtn = null;

        document.getElementById('language-select').value = selectedLanguage;
        document.getElementById('api-key-input').value = customApiKey;

        function getActiveApiKey() {
            return customApiKey.trim() !== '' ? customApiKey.trim() : DEFAULT_API_KEY;
        }

        function saveToStorage() { localStorage.setItem('qysd_chats', JSON.stringify(chats)); }
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        
        function saveSettings() {
            customApiKey = document.getElementById('api-key-input').value.trim();
            selectedLanguage = document.getElementById('language-select').value;
            localStorage.setItem('qysd_custom_api_key', customApiKey);
            localStorage.setItem('qysd_lang', selectedLanguage);
            closeSettings();
        }

        function autoResizeTextarea(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 130) + 'px';
        }

        function renderSidebar() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const wrapper = document.createElement('div');
                wrapper.className = `chat-item-wrapper ${chat.id === currentChatId ? 'active' : ''}`;

                const item = document.createElement('div');
                item.className = 'chat-item';
                item.textContent = chat.title || 'Nowa rozmowa';
                item.onclick = () => { loadChat(chat.id); closeMobileSidebar(); };

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-chat-btn';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chat.id); };

                wrapper.appendChild(item);
                wrapper.appendChild(delBtn);
                listEl.appendChild(wrapper);
            });
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id !== id);
            saveToStorage();
            if (currentChatId === id) { currentChatId = null; showHero(); }
            renderSidebar();
        }

        function startNewChat() {
            stopAudio();
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: 'Nowa konwersacja', messages: [] });
            saveToStorage();
            renderSidebar();
            
            document.getElementById('hero-section').style.display = 'none';
            const chatBox = document.getElementById('chat-box');
            chatBox.style.display = 'flex';
            chatBox.innerHTML = '';
            closeMobileSidebar();
        }

        function showHero() {
            document.getElementById('hero-section').style.display = 'flex';
            document.getElementById('chat-box').style.display = 'none';
            document.getElementById('chat-box').innerHTML = '';
        }

        function loadChat(id) {
            stopAudio();
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            if (!chat) return;

            renderSidebar();

            const chatBox = document.getElementById('chat-box');
            document.getElementById('hero-section').style.display = 'none';
            chatBox.style.display = 'flex';
            chatBox.innerHTML = '';

            chat.messages.forEach(msg => appendMessageToUI(msg.role, msg.text));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setPrompt(text) {
            const input = document.getElementById('prompt-input');
            input.value = text;
            autoResizeTextarea(input);
        }

        function formatMarkdown(text) {
            let processed = text;
            const codeBlocks = [];

            processed = processed.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang ? lang.toUpperCase() : 'KOD';
                const div = document.createElement('div');
                div.className = 'code-container';

                const header = document.createElement('div');
                header.className = 'code-header';
                header.innerHTML = `<span>Kod ${language}</span>`;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'code-btn';
                copyBtn.textContent = 'Kopiuj';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(code);
                    copyBtn.textContent = '✓ Skopiowano';
                    setTimeout(() => copyBtn.textContent = 'Kopiuj', 2000);
                };

                header.appendChild(copyBtn);

                const pre = document.createElement('pre');
                pre.textContent = code;

                div.appendChild(header);
                div.appendChild(pre);

                const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
                codeBlocks.push(div.outerHTML);
                return placeholder;
            });

            processed = processed
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\*(.*?)\*/g, '<i>$1</i>')
                .replace(/\n/g, '<br>');

            codeBlocks.forEach((blockHtml, index) => {
                processed = processed.replace(`__CODE_BLOCK_${index}__`, blockHtml);
            });

            return processed;
        }

        function stopAudio() {
            window.speechSynthesis.cancel();
            if (activeAudioBtn) {
                activeAudioBtn.innerHTML = '🔊 Odsłuchaj';
                activeAudioBtn = null;
            }
        }

        function toggleSpeech(text, btn) {
            if (window.speechSynthesis.speaking) {
                stopAudio();
                if (activeAudioBtn === btn) return;
            }

            const cleanText = text.replace(/```[\s\S]*?```/g, 'Oto kod.').replace(/\*\*/g, '').replace(/\*/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = selectedLanguage === 'Polski' ? 'pl-PL' : 'en-US';

            utterance.onend = () => stopAudio();
            utterance.onerror = () => stopAudio();

            activeAudioBtn = btn;
            btn.innerHTML = '⏹️ Zatrzymaj';

            window.speechSynthesis.speak(utterance);
        }

        function appendMessageToUI(role, text) {
            const chatBox = document.getElementById('chat-box');
            const msgEl = document.createElement('div');
            msgEl.className = `message ${role === 'user' ? 'msg-user' : 'msg-ai'}`;

            if (role === 'model') {
                const toolbar = document.createElement('div');
                toolbar.className = 'msg-toolbar';

                const audioBtn = document.createElement('button');
                audioBtn.className = 'action-btn';
                audioBtn.innerHTML = '🔊 Odsłuchaj';
                audioBtn.onclick = () => toggleSpeech(text, audioBtn);

                const copyMsgBtn = document.createElement('button');
                copyMsgBtn.className = 'action-btn';
                copyMsgBtn.innerHTML = '📋 Kopiuj';
                copyMsgBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyMsgBtn.innerHTML = '✓ Skopiowano';
                    setTimeout(() => copyMsgBtn.innerHTML = '📋 Kopiuj', 2000);
                };

                toolbar.appendChild(audioBtn);
                toolbar.appendChild(copyMsgBtn);

                const contentDiv = document.createElement('div');
                contentDiv.innerHTML = formatMarkdown(text);

                msgEl.appendChild(toolbar);
                msgEl.appendChild(contentDiv);
            } else {
                msgEl.textContent = text;
            }

            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgEl;
        }

        function createTypingIndicator() {
            const chatBox = document.getElementById('chat-box');
            const msgEl = document.createElement('div');
            msgEl.className = 'message msg-ai';
            msgEl.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
            chatBox.appendChild(msgEl);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgEl;
        }

        async function sendMessage() {
            const inputField = document.getElementById('prompt-input');
            const text = inputField.value.trim();
            if (text === '') return;

            const apiKey = getActiveApiKey();
            if (!apiKey || apiKey === 'AQ.Ab8RN6JJEsS22QzOfvVTCHLoeAkGnEDhinOoO-KB4TSyPXL8ew') {
                alert('Dodaj prawidłowy klucz API w pliku HTML lub w Ustawieniach.');
                openSettings();
                return;
            }

            if (!currentChatId) {
                currentChatId = Date.now().toString();
                chats.unshift({ id: currentChatId, title: text.slice(0, 25), messages: [] });
            }

            const activeChat = chats.find(c => c.id === currentChatId);
            if (activeChat && activeChat.messages.length === 0) activeChat.title = text.slice(0, 25);

            document.getElementById('hero-section').style.display = 'none';
            document.getElementById('chat-box').style.display = 'flex';

            if (activeChat) activeChat.messages.push({ role: 'user', text: text });
            saveToStorage();
            renderSidebar();

            appendMessageToUI('user', text);
            inputField.value = '';
            inputField.style.height = 'auto';

            const indicator = createTypingIndicator();

            const apiContents = activeChat ? activeChat.messages.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.text }]
            })) : [{ role: 'user', parts: [{ text }] }];

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: `Odpowiadaj w języku: ${selectedLanguage}. Używaj **gwiazdek** do pogrubień.` }]
                        },
                        contents: apiContents
                    })
                });

                const data = await response.json();
                indicator.remove();

                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    appendMessageToUI('model', reply);
                    if (activeChat) {
                        activeChat.messages.push({ role: 'model', text: reply });
                        saveToStorage();
                    }
                } else if (data.error) {
                    appendMessageToUI('model', 'Błąd API: ' + data.error.message);
                } else {
                    appendMessageToUI('model', 'Nie udało się uzyskać odpowiedzi.');
                }
            } catch (err) {
                indicator.remove();
                appendMessageToUI('model', 'Błąd połączenia z siecią.');
                console.error(err);
            }
        }

        function toggleSpeechRecognition() {
            const micBtn = document.getElementById('mic-btn');
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Rozpoznawanie mowy nie jest wspierane w tej przeglądarce.');
                return;
            }

            if (isRecording) {
                recognition.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            } else {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = selectedLanguage === 'Polski' ? 'pl-PL' : 'en-US';
                recognition.continuous = false;

                recognition.onstart = () => { isRecording = true; micBtn.classList.add('recording'); };
                recognition.onresult = (e) => {
                    const transcript = e.results[0][0].transcript;
                    const input = document.getElementById('prompt-input');
                    input.value = transcript;
                    autoResizeTextarea(input);
                };
                recognition.onend = () => { isRecording = false; micBtn.classList.remove('recording'); };
                recognition.start();
            }
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        if (chats.length > 0) { loadChat(chats[0].id); } else { renderSidebar(); }
    </script>
</body>
</html>
