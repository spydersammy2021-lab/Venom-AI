<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qysd AI Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Ukrycie paska przewijania dla całej strony */
        *::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            background-color: #0b0c0e;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background-color: #121316;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-right: 1px solid #1f2125;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.25rem;
            color: #d3e3fd;
            margin-bottom: 24px;
            padding: 4px 8px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #a8c7fa, #7cacf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #040e25;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(124, 172, 248, 0.25);
        }

        .action-btn {
            background: #1c1e22;
            border: 1px solid #2a2d32;
            color: #e3e3e3;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 8px;
        }

        .action-btn:hover {
            background: #25282e;
            border-color: #3f434a;
            transform: translateY(-1px);
        }

        .sidebar-bottom {
            border-top: 1px solid #1f2125;
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 0.75rem;
            color: #8e918f;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .language-select {
            background: #1c1e22;
            border: 1px solid #2a2d32;
            color: #e3e3e3;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            background: #181a1e;
            border: 1px solid #23262b;
            transition: all 0.2s;
        }

        .user-profile:hover {
            background: #22252b;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7cacf8, #a8c7fa);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #040e25;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #e3e3e3;
        }

        .user-status {
            font-size: 0.75rem;
            color: #8e918f;
        }

        /* Main Panel */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            background-color: #0b0c0e;
            height: 100%;
        }

        header {
            width: 100%;
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 12, 14, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .tags-container {
            display: flex;
            gap: 10px;
        }

        .model-tag {
            font-size: 0.8rem;
            color: #a8c7fa;
            background: #121316;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #1f2125;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .model-tag::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #34a853;
            border-radius: 50%;
            box-shadow: 0 0 8px #34a853;
        }

        .provider-tag {
            font-size: 0.8rem;
            color: #c4c6c5;
            background: #121316;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #1f2125;
            font-weight: 500;
        }

        .chat-container {
            width: 100%;
            max-width: 860px;
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero-section {
            margin: auto;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
            max-width: 680px;
            width: 100%;
        }

        .hero-title {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #669df6, #a8c7fa, #d3e3fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 28px;
            line-height: 1.25;
        }

        .quick-prompts {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .prompt-card {
            background: #121316;
            border: 1px solid #1f2125;
            border-radius: 16px;
            padding: 14px 20px;
            color: #e3e3e3;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prompt-card:hover {
            background: #1c1e22;
            border-color: #2a2d32;
            transform: translateY(-2px);
        }

        /* Styl wiadomości */
        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            line-height: 1.7;
            font-size: 1rem;
            animation: slideUp 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(12px);
        }

        .message.user {
            align-items: flex-end;
        }

        .message.user .bubble {
            background-color: #1f2125;
            color: #e3e3e3;
            padding: 12px 20px;
            border-radius: 20px 20px 4px 20px;
            max-width: 80%;
            border: 1px solid #2d3036;
        }

        .message.ai {
            align-items: flex-start;
            width: 100%;
        }

        .message.ai .bubble {
            background-color: transparent;
            color: #e3e3e3;
            padding: 4px 0;
            width: 100%;
            word-break: break-word;
        }

        /* Ładne pisanie tekstów piosenek i zwrotek */
        .message.ai .bubble p {
            margin-bottom: 12px;
            white-space: pre-line;
        }

        .message.ai .bubble blockquote {
            border-left: 3px solid #7cacf8;
            padding-left: 14px;
            margin: 12px 0;
            color: #d3e3fd;
            font-style: italic;
            background: rgba(124, 172, 248, 0.03);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
        }

        .message.ai .bubble pre {
            background: #121316;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1f2125;
            margin: 12px 0;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .msg-btn {
            background: transparent;
            border: none;
            color: #72757a;
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .msg-btn:hover {
            color: #e3e3e3;
            background: #1c1e22;
        }

        .input-container {
            width: 100%;
            max-width: 860px;
            padding: 0 24px 24px 24px;
        }

        .input-box {
            background-color: #121316;
            border-radius: 28px;
            padding: 12px 18px 12px 22px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            border: 1px solid #1f2125;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-box:focus-within {
            border-color: #33363d;
            box-shadow: 0 0 16px rgba(168, 199, 250, 0.05);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e3e3e3;
            font-size: 1rem;
            resize: none;
            height: 24px;
            max-height: 160px;
            line-height: 1.5;
            padding: 2px 0;
        }

        .input-info {
            display: flex;
            justify-content: flex-end;
            font-size: 0.75rem;
            color: #606368;
            padding: 6px 12px 0 12px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c4c6c5;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn {
            background: #a8c7fa;
            color: #040e25;
            font-weight: bold;
        }

        .send-btn:hover {
            background: #d3e3fd;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            background: #121316;
            border: 1px solid #282a2f;
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-input {
            background: #1c1e22;
            border: 1px solid #2a2d32;
            border-radius: 10px;
            padding: 10px 14px;
            color: #e3e3e3;
            font-size: 1rem;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #2a2d32;
            color: #e3e3e3;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: #a8c7fa;
            border: none;
            color: #040e25;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <aside>
        <div>
            <div class="brand">
                <div class="brand-icon">Q</div>
                <span>Qysd AI</span>
            </div>
            <button class="action-btn" onclick="resetChat()">+ Nowy czat</button>
            <button class="action-btn" onclick="exportChat()">💾 Zapisz historię</button>
        </div>

        <div class="sidebar-bottom">
            <div class="setting-item">
                <span class="setting-label">Język odpowiedzi</span>
                <select id="language-select" class="language-select">
                    <option value="Polski">Polski 🇵🇱</option>
                    <option value="Angielski">Angielski 🇬🇧</option>
                    <option value="Niemiecki">Niemiecki 🇩🇪</option>
                    <option value="Hiszpański">Hiszpański 🇪🇸</option>
                </select>
            </div>

            <div class="user-profile" onclick="openNameModal()">
                <div class="user-avatar" id="user-avatar">U</div>
                <div class="user-info">
                    <span class="user-name" id="user-name">Użytkownik</span>
                    <span class="user-status">Zmień nazwę</span>
                </div>
            </div>
        </div>
    </aside>

    <main>
        <header>
            <div class="tags-container">
                <div class="model-tag">Gemini 3.6 Flash</div>
                <div class="provider-tag">Powered by Google AI Studio</div>
            </div>
        </header>

        <div class="chat-container" id="chat-container">
            <div class="hero-section" id="hero-section">
                <h1 class="hero-title" id="greeting-title">Siema! Co dzisiaj tworzymy?</h1>
                
                <div class="quick-prompts">
                    <div class="prompt-card" onclick="usePrompt('Napisz tekst na szybki banger (piosenkę rap/drill)')">
                        🎵 Szybki banger
                    </div>
                    <div class="prompt-card" onclick="usePrompt('Napisz kod dla nowoczesnej strony internetowej HTML i CSS')">
                        💻 Stwórz stronę
                    </div>
                    <div class="prompt-card" onclick="usePrompt('Wymyśl pomysł na ciekawy projekt lub grę')">
                        🚀 Pomysł na projekt
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" placeholder="Zapytaj Qysd AI..." rows="1" oninput="handleInput(this)" onkeydown="handleKeyDown(event)"></textarea>
                <button class="icon-btn send-btn" onclick="sendMessage()" title="Wyślij">➔</button>
            </div>
            <div class="input-info">
                <span id="char-count">Znaków: 0</span>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="name-modal">
        <div class="modal-content">
            <div class="modal-title">Zmień swoją nazwę</div>
            <input type="text" id="name-input" class="modal-input" placeholder="Wpisz nowy nick...">
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeNameModal()">Anuluj</button>
                <button class="btn-primary" onclick="saveName()">Zapisz</button>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = JSON.parse(localStorage.getItem('QYSD_CHAT_HISTORY')) || [];
        let userName = localStorage.getItem('QYSD_USER_NAME') || "Użytkownik";

        updateUserUI();
        restoreChatHistory();

        function updateUserUI() {
            document.getElementById('user-name').textContent = userName;
            document.getElementById('user-avatar').textContent = userName.charAt(0).toUpperCase();
            document.getElementById('greeting-title').textContent = `Siema ${userName}! Co dzisiaj tworzymy?`;
        }

        function restoreChatHistory() {
            if (chatHistory.length > 0) {
                const heroSection = document.getElementById('hero-section');
                if (heroSection) heroSection.remove();

                chatHistory.forEach(msg => {
                    const side = msg.role === 'user' ? 'user' : 'ai';
                    let text = msg.parts[0].text;
                    if (side === 'user' && text.startsWith('[Odpowiadaj w języku:')) {
                        text = text.split('\n').slice(1).join('\n');
                    }
                    appendMessage(text, side, false);
                });
            }
        }

        function openNameModal() {
            document.getElementById('name-input').value = userName;
            document.getElementById('name-modal').style.display = 'flex';
            document.getElementById('name-input').focus();
        }

        function closeNameModal() {
            document.getElementById('name-modal').style.display = 'none';
        }

        function saveName() {
            const val = document.getElementById('name-input').value.trim();
            if (val) {
                userName = val;
                localStorage.setItem('QYSD_USER_NAME', userName);
                updateUserUI();
            }
            closeNameModal();
        }

        function handleInput(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
            document.getElementById('char-count').textContent = `Znaków: ${textarea.value.length}`;
        }

        function usePrompt(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const heroSection = document.getElementById('hero-section');
            if (heroSection) heroSection.remove();

            appendMessage(text, 'user');
            
            const targetLanguage = document.getElementById('language-select').value;
            const promptWithLanguage = `[Odpowiadaj w języku: ${targetLanguage}]\n${text}`;

            chatHistory.push({ role: "user", parts: [{ text: promptWithLanguage }] });
            saveHistory();

            input.value = '';
            input.style.height = '24px';
            document.getElementById('char-count').textContent = 'Znaków: 0';

            const loadingDiv = appendTypingIndicator();

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chatHistory })
                });

                const data = await res.json();
                loadingDiv.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    
                    chatHistory.push({ role: "model", parts: [{ text: aiResponse }] });
                    saveHistory();

                    appendMessage(aiResponse, 'ai', true);
                } else {
                    appendMessage("Błąd pobierania odpowiedzi.", 'ai');
                }
            } catch (err) {
                loadingDiv.remove();
                appendMessage("Błąd połączenia z serwerem.", 'ai');
            }
        }

        function appendMessage(text, side, animate = false) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${side}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (side === 'ai') {
                if (animate) {
                    typeText(bubble, text);
                } else {
                    bubble.innerHTML = marked.parse(text);
                }

                const actions = document.createElement('div');
                actions.className = 'msg-actions';
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'msg-btn';
                copyBtn.textContent = '📋 Kopiuj';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.textContent = '✓ Skopiowano!';
                    setTimeout(() => copyBtn.textContent = '📋 Kopiuj', 2000);
                };

                actions.appendChild(copyBtn);
                msgDiv.appendChild(bubble);
                msgDiv.appendChild(actions);
            } else {
                bubble.textContent = text;
                msgDiv.appendChild(bubble);
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgDiv;
        }

        /* Płynne, ładne wpisywanie tekstów */
        function typeText(element, fullText) {
            let index = 0;
            const speed = 15;
            
            function step() {
                if (index < fullText.length) {
                    index += 3;
                    element.innerHTML = marked.parse(fullText.substring(0, index));
                    const container = document.getElementById('chat-container');
                    container.scrollTop = container.scrollHeight;
                    setTimeout(step, speed);
                } else {
                    element.innerHTML = marked.parse(fullText);
                }
            }
            step();
        }

        function appendTypingIndicator() {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai';
            msgDiv.innerHTML = `<div class="bubble"><p><i>Qysd AI pisze...</i></p></div>`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
            return msgDiv;
        }

        function saveHistory() {
            localStorage.setItem('QYSD_CHAT_HISTORY', JSON.stringify(chatHistory));
        }

        function resetChat() {
            localStorage.removeItem('QYSD_CHAT_HISTORY');
            chatHistory = [];
            location.reload();
        }

        function exportChat() {
            if (chatHistory.length === 0) return alert("Brak historii do zapisania!");
            let fileContent = "HISTORIA CZATU - QYSD AI\n\n";
            
            chatHistory.forEach(msg => {
                const role = msg.role === 'user' ? 'Użytkownik' : 'Qysd AI';
                fileContent += `${role}:\n${msg.parts[0].text}\n\n------------------------\n\n`;
            });

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `czat-qysd-${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        }
    </script>
</body>
</html>
